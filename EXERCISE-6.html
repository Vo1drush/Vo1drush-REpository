<!DOCTYPE html>
<html>
<head>
    <title>Fetch 5 Users</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 30px;
        }

        button {
            padding: 10px 20px;
            background-color: blue;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .user {
            background: lightgreen;
            margin: 10px auto;
            padding: 10px;
            width: 300px;
            border-radius: 10px;
            text-align: left;
        }
    </style>
</head>

<body>
    <h2>Fetch 5 Users Data</h2>

    <button onclick="getUsers()">Get Users</button>

    <div id="output"></div>

    <script>
        async function getUsers() {
            const output = document.getElementById("output");
            output.textContent = "Loading users...";

            try {
                const response = await fetch(
                    "https://jsonplaceholder.typicode.com/users"
                );

                if (!response.ok) {
                    throw new Error("HTTP error: " + response.status);
                }

                const data = await response.json();
                output.innerHTML = "";

                for (let i = 0; i < 5; i++) {
                    const user = document.createElement("div");
                    user.className = "user";

                    const name = document.createElement("p");
                    name.innerHTML = "<b>Name:</b> ";
                    name.append(
                        document.createTextNode(data[i].name)
                    );

                    const email = document.createElement("p");
                    email.innerHTML = "<b>Email:</b> ";
                    email.append(
                        document.createTextNode(data[i].email)
                    );

                    const city = document.createElement("p");
                    city.innerHTML = "<b>City:</b> ";
                    city.append(
                        document.createTextNode(data[i].address.city)
                    );

                    user.append(name, email, city);
                    output.appendChild(user);
                }
            } catch (error) {
                output.textContent =
                    "Error fetching users. Please check your internet connection and try again.";

                console.error(error);
            }
        }
    </script>
</body>
</html>
